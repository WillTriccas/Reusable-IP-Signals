name: Prepare __SERVICE_SLUG__ deployment
on:
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment manifest
        run: |
          test -f deploy/deployment.yaml
          grep -q 'reviewed-tag' deploy/deployment.yaml
          echo 'Review image digest, approvals, and environment policy before integrating a deployment action.'
